name: Build Amethyst Kernel

on:
  workflow_dispatch:
    inputs:
      package_anykernel:
        description: 'Package into AnyKernel3 flashable zip'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - sixteen
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GKI Kernel for Amethyst
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            binutils-aarch64-linux-gnu \
            ca-certificates \
            cpio \
            curl \
            dwarves \
            file \
            flex \
            gcc \
            g++ \
            git \
            kmod \
            libelf-dev \
            libssl-dev \
            make \
            python3 \
            tar \
            wget \
            xz-utils \
            zip \
            zstd

      - name: Setup Neutron Clang Toolchain
        run: |
          mkdir -p "${HOME}/toolchain/clang"
          cd "${HOME}/toolchain/clang"
          curl -fSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
          chmod +x antman
          ./antman -S=latest
          ./antman --patch=glibc
          echo "${HOME}/toolchain/clang/bin" >> $GITHUB_PATH

      - name: Verify Clang Version
        run: |
          clang --version
          ld.lld --version

      - name: Setup AnyKernel3
        if: ${{ github.event.inputs.package_anykernel != 'false' }}
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 anykernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh
          sed -i 's/block=auto/block=boot/g' anykernel/anykernel.sh
          sed -i 's/is_slot_device=auto/is_slot_device=1/g' anykernel/anykernel.sh

      - name: Build Kernel Image & Modules
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1
          export KCFLAGS="-Wno-default-const-init-var-unsafe -Wno-default-const-init-field-unsafe -Wno-uninitialized-const-pointer"

          mkdir -p out dist/modules

          echo "--> Generating configuration..."
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 amethyst_defconfig

          echo "--> Building kernel..."
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image

          echo "--> Building in-tree modules..."
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 modules

          cp out/arch/arm64/boot/Image dist/Image

          echo "--> Installing modules..."
          mkdir -p "${GITHUB_WORKSPACE}/dist/modules_staging"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 INSTALL_MOD_PATH="${GITHUB_WORKSPACE}/dist/modules_staging" INSTALL_MOD_STRIP=1 modules_install
          find "${GITHUB_WORKSPACE}/dist/modules_staging" -name "*.ko" -exec cp -f {} "${GITHUB_WORKSPACE}/dist/modules/" \;
          tar -czf "${GITHUB_WORKSPACE}/dist/amethyst-modules.tar.gz" -C "${GITHUB_WORKSPACE}/dist/modules" .

      - name: Package AnyKernel3 Zip
        if: ${{ github.event.inputs.package_anykernel != 'false' }}
        run: |
          cp dist/Image anykernel/Image
          cd anykernel
          ZIP_NAME="Amethyst-GKI-Kernel-$(date +%Y%m%d_%H%M%S).zip"
          zip -r9 "../dist/${ZIP_NAME}" * -x .git README.md *placeholder
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Flashable AnyKernel3 Zip
        if: ${{ github.event.inputs.package_anykernel != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/*.zip

      - name: Upload Raw Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-amethyst
          path: dist/Image

      - name: Upload Compiled In-Tree Modules
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-modules
          path: dist/amethyst-modules.tar.gz
